# Render Blueprint：部署 FastAPI ONNX 推理服务（本仓库 backend/）
# 在 Render Dashboard → New → Blueprint → 连接仓库后勾选使用此文件
# Free 档位在 Dashboard 手动选择；Starter+ 可避免长时间休眠导致的冷启动
services:
  - type: web
    name: yoloweb-inference
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # 用 python -m 避免 PATH 里没有 uvicorn 可执行文件时出现 exit 127
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
