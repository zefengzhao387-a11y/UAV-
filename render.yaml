# Render Blueprint：部署 FastAPI ONNX 推理服务（本仓库 backend/）
# 在 Render Dashboard → New → Blueprint → 连接仓库后勾选使用此文件
# Free / 512MB：不要装 ultralytics（PyTorch 易 OOM）。若要用 YOLOWEB_INFER_ENGINE=ultralytics，改 build：
#   pip install -r requirements.txt -r requirements-ultralytics.txt
# 并升级到 ≥1GB 实例更安全。
services:
  - type: web
    name: yoloweb-inference
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # 用 python -m 避免 PATH 里没有 uvicorn 可执行文件时出现 exit 127
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
